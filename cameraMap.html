<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dragons! — Camera Map</title>
    <link rel="icon" type="image/png" href="/styles/ui/img/favicon.png" />
    <link rel="apple-touch-icon" href="/styles/ui/img/apple-touch-icon.png" />
    <style>
      :root {
        background: #0b1017;
        color-scheme: dark;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
      }
      button,
      input,
      select {
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 6px;
        padding: 6px 10px;
      }
      button {
        cursor: pointer;
      }
      button:hover,
      select:hover {
        border-color: var(--accent);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--edge);
      }
      header h1 {
        margin: 0 12px 0 0;
        font-size: 15px;
        letter-spacing: 0.08em;
      }
      header h1 span {
        color: var(--muted);
        font-weight: 400;
      }
      label {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        color: var(--muted);
      }
      #status {
        color: var(--muted);
        margin-left: auto;
      }
      #status.error {
        color: var(--danger);
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 12px;
        padding: 12px 16px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 8px;
        overflow: hidden;
      }
      .panel h2 {
        margin: 0;
        padding: 8px 12px;
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--muted);
        text-transform: uppercase;
        border-bottom: 1px solid var(--edge);
        display: flex;
        justify-content: space-between;
      }
      canvas {
        display: block;
        width: 100%;
      }
      #map {
        height: min(62vh, 640px);
      }
      #view {
        aspect-ratio: 16 / 9;
      }
      .side {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        margin: 0;
        padding: 10px 12px;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }
      #caption {
        padding: 10px 12px;
        font-size: 15px;
        min-height: 3em;
        border-top: 1px solid var(--edge);
      }
      #edl {
        max-height: 26vh;
        overflow: auto;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #edl li {
        display: grid;
        grid-template-columns: 88px 12px 1fr;
        gap: 8px;
        align-items: center;
        padding: 4px 12px;
        cursor: pointer;
        border-bottom: 1px solid var(--edge);
      }
      #edl li.current {
        background: var(--edge);
      }
      #edl i,
      .legend i {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        display: inline-block;
      }
      #edl time {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .timeline {
        grid-column: 1 / -1;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      #clock {
        font-variant-numeric: tabular-nums;
        min-width: 110px;
      }
      #scrub {
        flex: 1;
        min-width: 160px;
        padding: 0;
        accent-color: var(--accent);
      }
      #strip,
      #events {
        position: relative;
        border-radius: 4px;
        overflow: hidden;
        cursor: pointer;
      }
      #strip {
        height: 34px;
        background: var(--bg);
      }
      #events {
        height: 14px;
      }
      #strip div {
        position: absolute;
        top: 0;
        bottom: 0;
        border-right: 1px solid var(--bg);
        color: var(--bg);
        font-size: 11px;
        line-height: 1.2;
        padding: 3px 4px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #events span {
        position: absolute;
        top: 2px;
        width: 2px;
        height: 10px;
      }
      .playhead {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--text);
        pointer-events: none;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        color: var(--muted);
      }
      .legend span {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>DRAGONS! <span>/ CAMERA DIRECTOR</span></h1>
      <label
        >Source
        <select id="source">
          <option value="fixture">Synthetic fixture</option>
          <option value="hills">Synthetic hills</option>
          <option value="live">simulateRace + createCourse</option>
        </select></label
      >
      <label>Seed <input id="seed" value="fixture" size="10" /></label>
      <label>Racers <input id="count" type="number" min="2" max="12" value="8" /></label>
      <button id="rebuild">Rebuild</button>
      <label
        >Map
        <select id="mapMode">
          <option value="follow">Follow camera</option>
          <option value="course">Whole course</option>
        </select></label
      >
      <span id="status">Loading…</span>
    </header>
    <main>
      <section class="panel">
        <h2><span>Top-down map</span><span id="mapInfo"></span></h2>
        <canvas id="map"></canvas>
      </section>
      <div class="side">
        <section class="panel">
          <h2><span>Camera view (wireframe)</span><span id="shotName"></span></h2>
          <canvas id="view"></canvas>
          <div id="caption"></div>
        </section>
        <section class="panel">
          <h2><span>Shot</span></h2>
          <dl id="details"></dl>
        </section>
        <section class="panel">
          <h2><span>Edit decision list</span><span id="edlCount"></span></h2>
          <ul id="edl"></ul>
        </section>
      </div>
      <section class="panel timeline">
        <div class="controls">
          <button id="play">Play</button>
          <select id="speed">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
          <span id="clock">0.00 s</span>
          <input id="scrub" type="range" min="0" max="1" step="0.01" value="0" />
        </div>
        <div id="strip"><span class="playhead"></span></div>
        <div id="events"></div>
        <div class="legend" id="legend"></div>
      </section>
    </main>
    <script type="module" src="/src/camera/cameraMapPage.js"></script>
  </body>
</html>
