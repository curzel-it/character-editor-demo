    <meta charset="utf-8" />

    <link rel="stylesheet" href="/styles/ui/fonts/fonts.css" />

    <link rel="stylesheet" href="/styles/ui/profile.css" />
    <link rel="stylesheet" href="/styles/ui/lineage.css" />
    <link rel="stylesheet" href="/styles/ui/details.css" />
    <link rel="stylesheet" href="/styles/ui/altar.css" />
    <link rel="stylesheet" href="/styles/ui/broadcast.css" />
    <link rel="stylesheet" href="/styles/ui/countdown.css" />
    <link rel="stylesheet" href="/styles/ui/catchUp.css" />

  </head>
  <body class="dz-root">
    <div class="app" id="app">
      <header class="topbar">
        <a class="dz-logo dz-logo--corner" href="#/stable" id="logo" aria-label="Dragons!, back to the stable"></a>
        <button type="button" class="topbar__back" id="page-back" hidden></button>
        <h1 class="topbar__title" id="page-title" hidden></h1>
        <div class="topbar__play" id="play-bar" hidden></div>
      </header>
      <main class="screens" id="screens"></main>
      <nav class="dz-nav" id="nav" aria-label="Screens"></nav>
      <div class="dz-toasts" id="toasts" role="status"></div>
    </div>
    <div class="loading" id="loading" role="status">
      <div class="loading__card">
        <span class="dz-logo"><img class="dz-logo__art" src="/styles/ui/img/logo-peaks.png" alt="Dragons!" draggable="false" /></span>
        <div class="loading__track"><div class="loading__fill"></div></div>
        <p class="loading__label">Waking the stable…</p>
      </div>
    </div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
